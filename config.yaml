# Superficie declarativa del proyecto.
# Todo lo que cambia sin tocar código vive aquí.

project:
  name: credit-risk-mlops
  random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  parquet: data/parquet
  manifests: data/manifests
  exports: exports

sources:
  sba_7a:
    # El sufijo de vintage (asof_YYMMDD) cambia trimestralmente, por eso las URLs
    # se DESCUBREN scrapeando la página del dataset en vez de hardcodearse.
    # Ver docs/adr/0001-descubrimiento-de-urls-sba.md
    dataset_page: https://data.sba.gov/dataset/7a-504-foia
    file_pattern: 'FOIA_7a_FY.*\.csv$'
    license: US Government Work / FOIA (dominio público)
    encoding: latin-1

  # HMDA: el laboratorio de equidad. A diferencia de SBA, SI trae clases
  # protegidas (raza, etnia, sexo, edad) porque la ley obliga a reportarlas
  # justamente para poder auditar discriminación crediticia.
  hmda:
    api: https://ffiec.cfpb.gov/v2/data-browser-api/view
    # 2020-2024 cubre tres regímenes distintos en cinco años: el auge de
    # refinanciación (2020-21), el shock de tasas (2022) y la normalización
    # (2023-24). Es variación de régimen real, no simulada.
    years: [2020, 2021, 2022, 2023, 2024]
    # 1 = originado, 3 = denegado. Se excluyen retirados, incompletos y
    # comprados por otra institución: no son decisiones de suscripción.
    actions_kept: [1, 3]
    license: Dato público federal (HMDA / Regulation C)
    # Split out-of-time. 2024 como prueba es el año más reciente disponible y
    # cae del lado del shock de tasas; el modelo se entrena en el auge de
    # refinanciación y se prueba en un régimen distinto. Es duro a propósito.
    splits:
      train: { start: 2020, end: 2022 }
      valid: { start: 2023, end: 2023 }
      test:  { start: 2024, end: 2024 }
    # Muestreo Bernoulli por split. Con ~2M filas de prueba, el grupo protegido
    # más pequeño (2+ razas minoritarias, ~0.2% de las solicitudes) conserva
    # ~4,000 observaciones: error estándar de ~0.8 pp sobre su tasa de
    # denegación, suficiente para un umbral que se juega en décimas.
    sample_pct:
      train: 10
      valid: 25
      test: 25

# Reglas de exclusión — quirks conocidos del dataset SBA.
# Cada regla existe por una razón documentada; no borrar sin leer el ADR.
exclusions:
  # PPP se otorgó bajo criterios de emergencia, no de suscripción crediticia.
  # Incluirlo contaminaría el modelo con un régimen que no se repite.
  drop_ppp: true
  ppp_program_values: ["PPP"]

  # Solo resultados resueltos: un préstamo vigente no es "no incumplió",
  # es censura a la derecha. Mezclarlos sesga la tasa base hacia abajo.
  resolved_statuses: ["P I F", "CHGOFF"]   # ojo: "P I F" viene con espacios

  # Monto y plazo deben ser positivos para que las features tengan sentido.
  require_positive_amount: true
  require_positive_term: true

target:
  # Solo se declaran las claves que el código LEE. Antes había cuatro más
  # (pd_column, lgd_numerator, lgd_denominator) que ningún módulo consultaba:
  # config que aparenta funcionalidad es peor que config ausente, porque promete
  # una capacidad que no existe. Ver docs/AUDIT.md, defecto B2.
  pd_positive_value: CHGOFF

# Validación OUT-OF-TIME. Nunca split aleatorio: el riesgo de crédito
# tiene deriva temporal y un split aleatorio la esconde.
splits:
  date_column: ApprovalFY
  # Ventanas elegidas por dos criterios medidos, no por intuición. Ver ADR 0003.
  #  1. Régimen homogéneo: la tasa base del 7(a) fue 32-37% en 2006-2008 y 6-7%
  #     en 2012-2015. Entrenar cruzando la crisis cuesta ~2 puntos de AUC.
  #  2. Censura acotada: solo cosechas con >=70% de préstamos resueltos. FY2019
  #     está al 60.9% y su muestra queda sesgada hacia los que resolvieron rápido.
  train: { start: 2011, end: 2015 }   # post-crisis, 82-85% resuelto
  valid: { start: 2016, end: 2016 }   # 80.3% resuelto
  test:  { start: 2017, end: 2018 }   # 75.5% y 70.0% resuelto

# Cohortes de estrés: NO se entrena con ellas. Se usan para responder la pregunta
# que exige SR 26-2: si vuelve un 2007, ¿qué le pasa al modelo?
stress_cohorts:
  crisis_2005_2008: { start: 2005, end: 2008 }   # tasa base 24-37%
  covid_2020_2021:  { start: 2020, end: 2021 }   # régimen de emergencia
  reciente_2019:    { start: 2019, end: 2019 }   # censura al 60.9%

# Monitoreo (Semana 9). Ver docs/adr/0010: en crédito la etiqueta tarda ~51 meses
# medianos en existir, así que el disparador de reentrenamiento NO puede ser "cayó
# el AUC" — ese número no está disponible a tiempo.
monitoring:
  # Estados que NO representan un préstamo desembolsado. Vive aquí y no en
  # `exclusions` por una razón que el gate hizo explícita: `config_fingerprint`
  # hashea todo `exclusions`, así que ponerlo ahí invalidaba el entrenamiento
  # anterior y exigía reentrenar por un parámetro que el modelado no lee. La clave
  # va donde se usa.
  #
  # Un préstamo cancelado nunca se desembolsó: no forma parte de la población que
  # el modelo puntúa. EXEMPT y COMMIT SÍ entran, y es un supuesto declarado —se
  # asume que son préstamos vivos o sin estado publicado, cuyas features existen
  # igual—. Si EXEMPT fuera otra cosa, la población del monitoreo estaría
  # contaminada por ~297 mil registros. No afecta al modelado: ahí se exige
  # resultado conocido.
  not_booked_statuses: ["CANCLD"]

  # Cosechas que se vigilan: las posteriores al entrenamiento. FY2016 en adelante
  # incluye validación y test a propósito, para ver si el monitoreo detecta el
  # corrimiento que el proyecto ya conoce por otra vía (tasa base 6.75% → 9.60%).
  watch_from_fy: 2016

  # Umbrales de PSI. Convención de industria: <0.10 estable, 0.10-0.25 vigilar,
  # >0.25 acción. No se re-derivan porque no son propios del proyecto: son el
  # lenguaje en que un validador los va a leer.
  psi_warn: 0.10
  psi_action: 0.25

  # Disparador por tasa a madurez pareja (ADR 0010).
  matched_maturity_window_months: 24

  # Tolerancia relativa sobre la tasa de referencia a 24 meses (4.96%).
  #
  # DERIVACIÓN: las cinco cosechas de entrenamiento, medidas por separado a 24
  # meses, dan 5.59 / 4.16 / 4.45 / 5.07 / 5.32%. La desviación máxima contra la
  # referencia agrupada es 16.1% (FY2012). El umbral se pone en 2x esa variación
  # natural: una cosecha tiene que salirse el doble de lo que se mueven entre sí
  # las cosechas de un régimen estable.
  #
  # CONSECUENCIA, dicha por adelantado: con este umbral casi todas las cosechas
  # posteriores a FY2015 lo cruzan. No es un umbral mal calibrado — es el hallazgo.
  # La población lleva derivando desde FY2016.
  matched_maturity_tolerance: 0.32

# Gate de viabilidad de la Semana 1.
# Criterio fijado ANTES de ver resultados finales: eso lo hace de-risking, no p-hacking.
signal_gate:
  min_auc: 0.65
  method: lightgbm_quick
  note: "Si el baseline rápido no supera este AUC, se pivotea el target."

# Gates de CI que bloquean promoción de modelos.
#
# CADA UMBRAL TIENE DERIVACIÓN. Antes eran números elegidos porque el modelo los
# pasaba, que es una racionalización, no un control (docs/AUDIT.md, defecto C).
# En gobierno de modelos el umbral ES el artefacto, más que el modelo.
#
# Los gates se evalúan sobre la CONFIGURACIÓN DE PRODUCCIÓN — modelo + calibrador —
# no sobre el modelo crudo. Antes se evaluaba el crudo mientras producción
# despachaba el calibrado.
gates:
  # Modelo de referencia: el scorecard WoE, interpretable y aceptado sin discusión
  # por un validador. Es el piso permanente.
  baseline_model: scorecard_woe

  # POLÍTICA, no número: el retador tiene que superar al interpretable por un
  # margen claro. Si no lo hace, se despliega el interpretable y punto. Un gate
  # relativo no se puede acomodar eligiendo la cifra.
  # 0.02 de AUC ~ 0.04 de Gini, el mínimo que un comité de riesgo considera
  # material frente a perder interpretabilidad.
  min_margin_over_baseline: 0.02

  # Piso absoluto de respaldo, por si el baseline también se degradara.
  # Derivado del baseline medido (0.6694) + el margen exigido.
  min_auc_test: 0.6894

  # Derivado de la variación natural de AUC entre cosechas de test con la misma
  # configuración: FY2017 0.717 | FY2018 0.685 | FY2019 0.678 -> rango 0.039.
  # Se admite el doble de esa variación antes de considerarlo degradación real.
  max_auc_drop_oot: 0.08

  # El modelo debe al menos vencer al predictor SIN HABILIDAD, que predice
  # siempre la tasa base. Su Brier es p(1-p) = 0.096 x 0.904 = 0.0868.
  # El umbral anterior era 0.20: 2.3 veces PEOR que no hacer nada.
  max_brier_test: 0.0868

  # Calibración: lo predicho y lo observado deben coincidir dentro de 2 puntos
  # porcentuales en promedio. Por encima de eso, el expected loss en dólares
  # empieza a desviarse lo suficiente como para cambiar una decisión de corte.
  max_ece_test: 0.02

  # Regla de los 4/5 del EEOC (Uniform Guidelines on Employee Selection
  # Procedures, 29 CFR 1607.4D). Es el único umbral con origen legal, no técnico.
  min_disparate_impact_ratio: 0.80

# Features disponibles EN EL MOMENTO DE LA DECISIÓN de aprobación.
# Cualquier campo posterior a la decisión es fuga, aunque sea anterior al resultado.
#
# IMPORTANTE: estos son nombres a nivel PANEL (los que produce el loader), y el
# código LOS LEE de aquí. No hay copia hardcodeada en Python. Antes sí la había,
# en otra convención de nombres, y el fingerprint hasheaba esta lista mientras el
# modelo usaba la otra: se podía quitar una variable sin que el gate lo notara.
# Ver docs/AUDIT.md, defecto A2.
features:
  numeric:
    - gross_approval
    - sba_guaranteed
    - initial_rate
    - jobs_supported
    - guarantee_pct
    - log_gross_approval

  categorical:
    - naics_sector
    - business_type
    - business_age
    - revolver_status
    - collateral_ind
    - rate_type
    - processing_method
    - borrower_state
    - has_franchise

  # De qué campo fuente sale cada feature del panel. Documentación de linaje:
  # hace auditable de dónde viene cada número.
  lineage:
    gross_approval:     GrossApproval
    sba_guaranteed:     SBAGuaranteedApproval
    initial_rate:       InitialInterestRate
    jobs_supported:     JobsSupported
    guarantee_pct:      SBAGuaranteedApproval / GrossApproval
    log_gross_approval: ln(GrossApproval)
    naics_sector:       NaicsCode (2 primeros dígitos)
    has_franchise:      FranchiseCode no vacío
    business_type:      BusinessType
    business_age:       BusinessAge
    revolver_status:    RevolverStatus
    collateral_ind:     CollateralInd
    rate_type:          FixedorVariableInterestInd
    processing_method:  ProcessingMethod
    borrower_state:     BorrState

  # Nombres de PANEL que jamás pueden ser features.
  forbidden_panel:
    - term_months      # ADR 0002: se sobrescribe al liquidar
    - is_chargeoff     # target PD
    - chargeoff_amount # target LGD
    - approval_fy      # eje del split out-of-time

  # Nombres FUENTE prohibidos, para el chequeo sobre la query del loader.
  forbidden:
    - LoanStatus
    - PaidInFullDate
    - ChargeOffDate
    - GrossChargeOffAmount
    - FirstDisbursementDate
    - SoldSecMrktInd
    - AsOfDate
    - ApprovalFY
    - TermInMonths
