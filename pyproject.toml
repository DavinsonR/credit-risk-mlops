[project]
name = "crmlops"
version = "0.1.0"
description = "Credit risk decision system with model risk governance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Davirson Novoa R" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.13",
    "optbinning>=0.21.0",
    "mlflow>=3.16.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-cov>=5.0"]
# torch va como extra: CI no lo necesita y son ~200 MB.
#   uv sync --extra neural
neural = ["torch>=2.4"]
# PySpark solo para el benchmark de backends; requiere un JDK instalado.
#   uv sync --extra spark
spark = ["pyspark>=3.5"]

# Indice explicito para torch CPU. `explicit = true` es la clave: sin eso uv
# resolveria TODAS las dependencias contra el indice de PyTorch y rompe
# paquetes como requests, que ahi existe en versiones viejas.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crmlops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "NPY", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "data: requires acquired source data (skipped in CI)",
    "slow: long-running",
]
