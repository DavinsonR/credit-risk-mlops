name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sin permisos de escritura: CI solo verifica, no publica.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        # onnx y serve, no solo dev: los tests de paridad entre las tres vias de
        # serving importan onnxruntime y fastapi. Sin ellos pytest falla al
        # importar y el fallo no dice que faltaba una dependencia opcional.
        # No se instalan neural ni spark: PyTorch y la JVM no hacen falta aqui.
        run: uv sync --extra dev --extra onnx --extra serve

      # La parte de `make setup` que configura el repo, no el entorno. Los tests de
      # autoria verifican el estado CONFIGURADO --core.hooksPath apuntando al hook--
      # y .git/hooks no se clona, asi que sin esta linea la suite falla en CI y pasa
      # en local. Paso exactamente lo contrario de lo que uno esperaria: CI llevaba
      # rojo desde la semana 8 por un test que solo era verde en mi maquina.
      - name: Configurar el hook de autoria (equivalente a `make setup`)
        run: |
          git config core.hooksPath scripts/hooks
          test "$(git config core.hooksPath)" = "scripts/hooks"

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # CI corre sobre tests/fixtures/ (muestra sin PII), NUNCA descarga datos:
      # el corte completo son ~860 MB y el vintage rota cada trimestre, asi que
      # un CI que descargue seria lento y no determinista.
      - name: Tests
        run: uv run pytest -m "not data" -q

      - name: Verificar que no se commitearon datos crudos
        run: |
          if git ls-files | grep -E 'data/(raw|interim|parquet)/.*\.(csv|parquet)$'; then
            echo "::error::Hay datos crudos trackeados en git"
            exit 1
          fi
          echo "OK: sin datos crudos en el repo"

      # Los gates leen exports/metrics.json (commiteado) en vez de reentrenar:
      # entrenar exige ~860 MB de datos crudos que no viven en el repo. El gate
      # de coherencia impide que ese artefacto se desincronice de config.yaml.
      - name: Gates de promocion del modelo
        run: uv run python -m crmlops.governance.gates

      # Publicar es aguas abajo de promover: este paso va DESPUES de los gates. El
      # bundle no recalcula nada, asi que lo unico que puede pasarle es quedar
      # desincronizado de sus fuentes -- y eso es exactamente lo que se verifica.
      - name: Bundle web coherente con sus fuentes
        run: uv run python -m crmlops.export.web --check

      - name: Verificar autoria sin atribucion a IA
        run: |
          if git log --format='%B' -50 | grep -iE 'co-authored-by:.*(claude|anthropic|copilot)'; then
            echo "::error::Se detecto atribucion a IA en el historial"
            exit 1
          fi
          echo "OK: autoria limpia"

  serving:
    name: Imagen de serving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Construir y ejecutar de verdad. Un Dockerfile que nunca se construyo en
      # CI es una afirmacion, no una capacidad verificada.
      - name: Construir la imagen
        run: docker build -f serving/api/Dockerfile -t crmlops-serving:ci .

      - name: Verificar que la imagen NO trae el stack de entrenamiento
        run: |
          # La razon de exportar a ONNX es que el serving no reproduzca el
          # entorno de entrenamiento. Si LightGBM o pandas entran a la imagen,
          # esa separacion se perdio en silencio.
          for pkg in lightgbm pandas sklearn torch pyspark; do
            if docker run --rm --entrypoint python crmlops-serving:ci \
                 -c "import $pkg" 2>/dev/null; then
              echo "::error::La imagen de serving incluye $pkg; deberia traer solo onnxruntime"
              exit 1
            fi
          done
          echo "OK: la imagen no incluye el stack de entrenamiento"

      - name: Smoke test del servicio
        run: |
          docker run -d --name scoring -p 8000:8000 crmlops-serving:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 2
          done

          echo "--- /health ---"
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          echo

          echo "--- /score ---"
          curl -fsS -X POST http://localhost:8000/score \
            -H 'Content-Type: application/json' \
            -d '{"gross_approval":250000,"sba_guaranteed":187500,"initial_rate":8.5,
                 "jobs_supported":6,"naics_sector":"72","business_type":"CORPORATION",
                 "business_age":"Existing or more than 2 years old","revolver_status":"N",
                 "collateral_ind":"Y","rate_type":"V",
                 "processing_method":"Preferred Lenders Program",
                 "borrower_state":"TX","has_franchise":0}' | tee /tmp/score.json
          echo

          # La respuesta tiene que ser una probabilidad valida, no cualquier JSON.
          # Se usa python -c y no un heredoc: dentro de un bloque `run: |` el
          # terminador del heredoc queda indentado y el shell nunca lo reconoce.
          python -c "
          import json
          d = json.load(open('/tmp/score.json'))
          pd = d['probability_of_default']
          assert 0 < pd < 1, f'PD fuera de rango: {pd}'
          assert d['score_band'] in 'ABCDE', d['score_band']
          suma = d['expected_loss_sba_usd'] + d['expected_loss_lender_usd']
          assert abs(suma - d['expected_loss_usd']) < 1, 'la perdida no cuadra'
          print(f'OK: PD={pd:.6f} banda={d[\"score_band\"]} EL=\${d[\"expected_loss_usd\"]:,.2f}')
          "

      - name: Logs si algo fallo
        if: failure()
        run: docker logs scoring || true
